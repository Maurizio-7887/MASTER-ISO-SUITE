name: Innovation Labs ISO 56001 tests
on:
  push:
    branches: [feature/iso56001-laboratori-innovation-github]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validate syntax
        run: python -m compileall -q app tests
      - name: Flask integration regressions
        run: python -m pytest tests/test_suite.py tests/test_innovation_labs.py -q
